<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de invitaciones — Mariana</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Quicksand',sans-serif; background:linear-gradient(160deg,#fff0f5,#f5f0ff);
    color:#6b5560; min-height:100vh; padding:24px 16px 60px;
  }
  h1{
    font-family:'Dancing Script',cursive; color:#ff6f9c; text-align:center; font-size:2.2rem; margin:0 0 4px;
  }
  .sub{text-align:center; color:#8a6a75; margin:0 0 24px; font-size:.95rem;}
  .card{
    max-width:560px; margin:0 auto 20px; background:#fff; border-radius:20px; padding:20px;
    box-shadow:0 10px 30px rgba(255,140,180,.15);
  }
  label{display:block; font-weight:700; color:#ff6f9c; margin-bottom:8px; font-size:.9rem;}
  textarea{
    width:100%; min-height:160px; border-radius:12px; border:1.5px solid #f3c6d4; padding:12px;
    font-family:'Quicksand',sans-serif; font-size:.95rem; resize:vertical;
  }
  input[type=text]{
    width:100%; border-radius:999px; border:1.5px solid #f3c6d4; padding:10px 16px;
    font-family:'Quicksand',sans-serif; font-size:.9rem; margin-bottom:4px;
  }
  .hint{font-size:.78rem; color:#a08890; margin:6px 0 0;}
  button{
    display:block; width:100%; margin-top:14px; padding:12px; border:none; border-radius:999px;
    background:linear-gradient(135deg,#a8e6b0,#7fd48f); color:#2f5233; font-weight:700; font-size:1rem;
    cursor:pointer;
  }
  button:active{transform:scale(.98);}
  #results{max-width:560px; margin:0 auto;}
  .toolbar-row{max-width:560px; margin:0 auto; display:flex; gap:10px;}
  .toolbar-row button{margin-top:0;}
  #saveListBtn{background:linear-gradient(135deg,#ffd9a0,#ffbf6b); color:#5a3a10;}
  .progress-note{max-width:560px; margin:10px auto 4px; font-size:.8rem; color:#a08890; text-align:center;}
  .link-row{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:12px 14px;
    margin-bottom:10px; box-shadow:0 4px 12px rgba(0,0,0,.05);
    transition:opacity .2s ease;
  }
  .link-row{flex-wrap:wrap;}
  .link-row.sent{opacity:.55;}
  .link-row .name{font-weight:700; flex:0 0 auto; min-width:120px; color:#6b5560;}
  .link-row .url{flex:1; min-width:180px; font-size:.78rem; color:#8a7fc0; word-break:break-all;}
  .link-row .gender-select{
    flex:0 0 auto; border-radius:999px; border:1.5px solid #f3c6d4; background:#fff9fb;
    padding:6px 10px; font-family:'Quicksand',sans-serif; font-size:.76rem; color:#6b5560;
  }
  .link-row .copy-btn{
    flex:0 0 auto; background:#ffe3ee; color:#e8789e; border:none; border-radius:999px;
    padding:7px 14px; font-size:.78rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .link-row .wa-btn{
    flex:0 0 auto; background:#dcf5e3; color:#1f8a45; border:none; border-radius:999px;
    padding:7px 14px; font-size:.78rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .link-row .sent-btn{
    flex:0 0 auto; background:#f2eee9; color:#8a7d78; border:none; border-radius:999px;
    padding:7px 12px; font-size:.78rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .link-row.sent .sent-btn{background:#c8f4de; color:#2f5233;}
  .copy-btn.copied{background:#c8f4de; color:#2f5233;}
  #copyAllBtn{background:linear-gradient(135deg,#a8d8ea,#8fc3e0); color:#1c3f4d; margin-bottom:20px;}
</style>
</head>
<body>

<h1>Generador de invitaciones 🎈</h1>
<p class="sub">Pegá la lista de invitados y generá el link personalizado de cada uno.</p>

<div class="card">
  <label for="baseUrl">Link base de tu invitación</label>
  <input type="text" id="baseUrl" value="https://marianamendozasoler-code.github.io/mariana-cumple-invitacion/" placeholder="https://tu-usuario.github.io/tu-repo/">
  <p class="hint">Ya lo dejé puesto con tu sitio — lo podés editar acá si alguna vez cambia.</p>

  <label for="names" style="margin-top:16px;">Lista de invitados (un nombre por línea)</label>
  <textarea id="names" placeholder="Juan David Duque&#10;María José Pérez&#10;Familia Rodríguez"></textarea>

  <button onclick="generar()">✨ Generar links</button>
</div>

<div id="results"></div>

<script>
// mensaje fijo que se manda por WhatsApp junto con el link personalizado de cada invitado
const WA_MESSAGE =
  '🌸 Mariana cumple su primer añito 🌸\n' +
  'Hace un año llegó a nuestras vidas para llenarlas de amor, sonrisas y momentos inolvidables. ❤️\n' +
  'Hoy queremos celebrar su primer año de vida rodeados de las personas que queremos.\n' +
  '🎀 Nos encantaría que nos acompañaras en este día tan especial.\n' +
  '✨ En el Link adjunto puedes ver todos los detalles de la celebración.';

const STORAGE_KEY = 'invitadosListaMariana';

// intenta autocompletar con la URL de esta misma carpeta, reemplazando invitados.html por index.html
(function(){
  const guess = location.href.replace(/invitados\.html.*$/, 'index.html');
  if(guess.startsWith('http')){
    document.getElementById('baseUrl').value = guess;
  }
})();

// asegura que el link SIEMPRE lleve https:// (o http://) adelante — si falta, WhatsApp no lo detecta como link tocable
function normalizeBase(u){
  u = (u || '').trim();
  if(!u) return u;
  if(!/^https?:\/\//i.test(u)){
    u = 'https://' + u;
  }
  return u;
}

// arma el link según el género elegido: sin elegir nada, no manda &g= y el sitio saluda neutro ("Bienvenid@")
function buildUrl(base, sep, name, gender){
  let u = base + sep + 'n=' + encodeURIComponent(name);
  if(gender) u += '&g=' + gender;
  return u;
}

function crearFila(resultsEl, base, sep, name, savedState){
  savedState = savedState || {};
  let gender = savedState.gender || '';
  let sent = !!savedState.sent;

  const row = document.createElement('div');
  row.className = 'link-row' + (sent ? ' sent' : '');
  row.dataset.name = name;
  row.innerHTML =
    '<span class="name">' + name + '</span>' +
    '<select class="gender-select">' +
      '<option value="">Bienvenid@ (neutro)</option>' +
      '<option value="m">Bienvenido (él)</option>' +
      '<option value="f">Bienvenida (ella)</option>' +
      '<option value="p">Bienvenidos (varios)</option>' +
    '</select>' +
    '<span class="url"></span>' +
    '<button class="copy-btn" type="button">Copiar</button>' +
    '<button class="wa-btn" type="button">📲 WhatsApp</button>' +
    '<button class="sent-btn" type="button">' + (sent ? '✓ Enviado' : 'Marcar enviado') + '</button>';

  const urlEl = row.querySelector('.url');
  const selectEl = row.querySelector('.gender-select');
  selectEl.value = gender;

  function refresh(){ urlEl.textContent = buildUrl(base, sep, name, gender); }
  refresh();

  selectEl.addEventListener('change', () => {
    gender = selectEl.value;
    refresh();
    guardarLista(resultsEl);
  });

  row.querySelector('.copy-btn').addEventListener('click', function(){
    navigator.clipboard.writeText(urlEl.textContent).then(() => {
      this.textContent = '¡Copiado!';
      this.classList.add('copied');
      setTimeout(() => { this.textContent = 'Copiar'; this.classList.remove('copied'); }, 1500);
    });
  });

  // botón de WhatsApp: copia el mensaje completo (texto + link) por si hace falta pegarlo a mano,
  // y además abre WhatsApp con el mensaje ya cargado para elegir a quién mandárselo
  row.querySelector('.wa-btn').addEventListener('click', function(){
    const fullMsg = WA_MESSAGE + '\n\n' + urlEl.textContent;
    navigator.clipboard.writeText(fullMsg).catch(() => {});
    window.open('https://wa.me/?text=' + encodeURIComponent(fullMsg), '_blank');
  });

  row.querySelector('.sent-btn').addEventListener('click', function(){
    sent = !sent;
    row.classList.toggle('sent', sent);
    this.textContent = sent ? '✓ Enviado' : 'Marcar enviado';
    guardarLista(resultsEl);
  });

  resultsEl.appendChild(row);
}

function generar(){
  let base = normalizeBase(document.getElementById('baseUrl').value);
  document.getElementById('baseUrl').value = base;
  if(!base){ alert('Pegá primero el link de tu invitación'); return; }
  if(!base.includes('?') && !base.endsWith('/') && !base.endsWith('.html')){
    base += '/';
  }
  const sep = base.includes('?') ? '&' : '?';

  const names = document.getElementById('names').value
    .split('\n')
    .map(n => n.trim())
    .filter(n => n.length > 0);

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';

  if(names.length === 0){ alert('Pegá al menos un nombre'); return; }

  const toolbarRow = document.createElement('div');
  toolbarRow.className = 'toolbar-row';
  const allBtn = document.createElement('button');
  allBtn.id = 'copyAllBtn';
  allBtn.textContent = '📋 Copiar todos los links (con nombre)';
  const saveBtn = document.createElement('button');
  saveBtn.id = 'saveListBtn';
  saveBtn.type = 'button';
  saveBtn.textContent = '💾 Guardar lista';
  toolbarRow.appendChild(allBtn);
  toolbarRow.appendChild(saveBtn);
  resultsEl.appendChild(toolbarRow);

  const note = document.createElement('p');
  note.className = 'progress-note';
  note.textContent = 'Tu lista se guarda sola en este navegador. Si no alcanzás a mandarlas todas, marcá "Enviado" en las que ya mandaste — al volver a abrir esta página, tu progreso sigue ahí.';
  resultsEl.appendChild(note);

  names.forEach((name) => crearFila(resultsEl, base, sep, name, {}));

  allBtn.addEventListener('click', () => {
    const lines = Array.from(resultsEl.querySelectorAll('.link-row')).map(row =>
      row.querySelector('.name').textContent + ': ' + row.querySelector('.url').textContent
    );
    navigator.clipboard.writeText(lines.join('\n')).then(() => {
      allBtn.textContent = '¡Copiados todos!';
      setTimeout(() => { allBtn.textContent = '📋 Copiar todos los links (con nombre)'; }, 1800);
    });
  });

  // botón "Guardar lista": guarda el progreso en este navegador y además descarga un .txt de respaldo,
  // por si el celular se resetea o querés seguir mandando invitaciones desde otro lado
  saveBtn.addEventListener('click', () => {
    guardarLista(resultsEl);
    const lines = Array.from(resultsEl.querySelectorAll('.link-row')).map(row => {
      const sent = row.classList.contains('sent') ? ' [ENVIADO]' : '';
      return row.querySelector('.name').textContent + ': ' + row.querySelector('.url').textContent + sent;
    });
    const blob = new Blob([lines.join('\n')], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'invitaciones-mariana.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    saveBtn.textContent = '¡Guardado!';
    setTimeout(() => { saveBtn.textContent = '💾 Guardar lista'; }, 1800);
  });

  guardarLista(resultsEl);
}

// guarda en este navegador: base, lista de nombres, género elegido y quién ya está marcado como enviado
function guardarLista(resultsEl){
  const base = document.getElementById('baseUrl').value;
  const rows = Array.from(resultsEl.querySelectorAll('.link-row')).map(row => ({
    name: row.dataset.name,
    gender: row.querySelector('.gender-select').value,
    sent: row.classList.contains('sent')
  }));
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ base, rows }));
  }catch(err){ /* si el navegador bloquea localStorage, no pasa nada grave: solo no se recuerda */ }
}

// al abrir la página, si había una lista guardada de una vez anterior, la vuelve a mostrar
(function restaurarLista(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }catch(err){ saved = null; }
  if(!saved || !saved.rows || !saved.rows.length) return;

  document.getElementById('baseUrl').value = saved.base || document.getElementById('baseUrl').value;
  document.getElementById('names').value = saved.rows.map(r => r.name).join('\n');

  let base = normalizeBase(saved.base);
  if(!base.includes('?') && !base.endsWith('/') && !base.endsWith('.html')){
    base += '/';
  }
  const sep = base.includes('?') ? '&' : '?';

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';

  const toolbarRow = document.createElement('div');
  toolbarRow.className = 'toolbar-row';
  const allBtn = document.createElement('button');
  allBtn.id = 'copyAllBtn';
  allBtn.textContent = '📋 Copiar todos los links (con nombre)';
  const saveBtn = document.createElement('button');
  saveBtn.id = 'saveListBtn';
  saveBtn.type = 'button';
  saveBtn.textContent = '💾 Guardar lista';
  toolbarRow.appendChild(allBtn);
  toolbarRow.appendChild(saveBtn);
  resultsEl.appendChild(toolbarRow);

  const note = document.createElement('p');
  note.className = 'progress-note';
  note.textContent = 'Lista recuperada de tu última visita. Seguí marcando "Enviado" a medida que avanzás.';
  resultsEl.appendChild(note);

  saved.rows.forEach(r => crearFila(resultsEl, base, sep, r.name, r));

  allBtn.addEventListener('click', () => {
    const lines = Array.from(resultsEl.querySelectorAll('.link-row')).map(row =>
      row.querySelector('.name').textContent + ': ' + row.querySelector('.url').textContent
    );
    navigator.clipboard.writeText(lines.join('\n')).then(() => {
      allBtn.textContent = '¡Copiados todos!';
      setTimeout(() => { allBtn.textContent = '📋 Copiar todos los links (con nombre)'; }, 1800);
    });
  });

  saveBtn.addEventListener('click', () => {
    guardarLista(resultsEl);
    const lines = Array.from(resultsEl.querySelectorAll('.link-row')).map(row => {
      const sent = row.classList.contains('sent') ? ' [ENVIADO]' : '';
      return row.querySelector('.name').textContent + ': ' + row.querySelector('.url').textContent + sent;
    });
    const blob = new Blob([lines.join('\n')], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'invitaciones-mariana.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    saveBtn.textContent = '¡Guardado!';
    setTimeout(() => { saveBtn.textContent = '💾 Guardar lista'; }, 1800);
  });
})();
</script>

</body>
</html>
